name: Android release

# 不随 push 或 pull request 自动编译。在 Actions 页面手动运行。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0
  # 生产地址只来自仓库变量 PROCLAN_API_BASE。不要在这个文件里写默认域名。
  # App 把 API_BASE 当源站用，自己拼 /v1/...，所以这里不带路径。
  API_BASE: ${{ vars.PROCLAN_API_BASE }}

jobs:
  apk:
    name: Build production APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Write production env
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ]; then
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::Repository variable PROCLAN_API_BASE is empty. Set it to an https origin. Do not hardcode the address in the workflow."
              exit 1
            fi
            echo "PROCLAN_API_BASE is not set; this ref will run tests only."
            echo "SKIP_APK=1" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$API_BASE" in
            https://*) ;;
            *) echo "API_BASE must be an https origin, got: $API_BASE" >&2; exit 1 ;;
          esac
          printf 'API_BASE=%s\n' "$API_BASE" > app/.env.production
          echo "building against $API_BASE"

      # 固定发布密钥。不写这份配置时 Gradle 会退回各机器自带的调试密钥，
      # 每次构建签名都不同，手机上覆盖安装就会报签名异常。
      - name: Write release signing
        if: env.SKIP_APK != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCLAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PROCLAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROCLAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PROCLAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::PROCLAN_KEYSTORE_BASE64 is missing; refusing to publish an APK that no phone can update over"
              exit 1
            fi
            echo "::warning::No release keystore secret; this build uses the per-run debug key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/proclan-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          umask 077
          cat > app/android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeType=PKCS12
          EOF

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Widget tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        if: env.SKIP_APK != '1'
        run: ./scripts/apk production

      # 签名必须每次相同，否则手机上无法覆盖安装。这里把证书指纹打出来当证据。
      - name: Verify signature
        if: env.SKIP_APK != '1'
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          signer=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee certs.txt
          fp=$(grep -m1 'SHA-256 digest' certs.txt | sed 's/.*: //')
          echo "SIGNER_SHA256=$fp" >> "$GITHUB_ENV"
          if grep -q 'CN=Android Debug' certs.txt; then
            echo "::warning::Signed with a machine-local debug key; phones cannot update over an earlier build"
          fi

      - name: Checksum and summary
        if: env.SKIP_APK != '1'
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          sha256sum "$apk" | tee apk.sha256
          {
            echo "### Proclan APK"
            echo ""
            echo "| 字段 | 值 |"
            echo "| --- | --- |"
            echo "| API_BASE | \`$API_BASE\` |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| 文件大小 | $(du -h "$apk" | cut -f1) |"
            echo "| 签名证书 | \`$SIGNER_SHA256\` |"
            echo "| sha256 | \`$(cut -d' ' -f1 apk.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: env.SKIP_APK != '1'
        uses: actions/upload-artifact@v7
        with:
          name: proclan-apk-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 30

      # 只对 main 发布。下载地址固定不变，手机浏览器点开就能存，不用登录：
      # https://github.com/huamingjie0815/OpenProclan/releases/latest/download/app-release.apk
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=apk-latest
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          sha=$(cut -d' ' -f1 apk.sha256)
          size=$(du -h "$apk" | cut -f1)
          {
            printf '手动构建的生产包，API_BASE=`%s`。\n\n' "$API_BASE"
            printf '| 字段 | 值 |\n'
            printf '| --- | --- |\n'
            printf '| commit | `%s` |\n' "$GITHUB_SHA"
            printf '| 构建 | [run %s](%s/%s/actions/runs/%s) |\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| 文件大小 | %s |\n' "$size"
            printf '| 签名证书 | `%s` |\n' "${SIGNER_SHA256:-unknown}"
            printf '| sha256 | `%s` |\n\n' "$sha"
            printf '手机浏览器直接打开 app-release.apk 下载，安装时允许「安装未知来源应用」。\n\n'
            printf '这个包用固定发布密钥签名，可以覆盖安装以后的新版本。如果手机上还是更早的调试签名版本，先卸载一次再装。\n'
          } > release-notes.md
          # 每次重建同一个 release，tag 指向最新提交，下载地址保持不变。
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Proclan APK（最新构建）" \
            --latest \
            --notes-file release-notes.md \
            "$apk" apk.sha256
